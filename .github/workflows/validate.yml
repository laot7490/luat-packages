name: Validate and publish packages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: package-registry-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: laot7490/luat
          ref: main
          path: target/luat
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo build --locked --manifest-path target/luat/Cargo.toml -p luat
      - run: target/luat/target/debug/luat package registry-check --project .
        env:
          LUAT_PACKAGE_BASE: ${{ github.event.pull_request.base.sha }}

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: laot7490/luat
          ref: main
          path: target/luat
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo build --locked --manifest-path target/luat/Cargo.toml -p luat
      - run: target/luat/target/debug/luat package registry-build --project .
        env:
          LUAT_PACKAGE_BASE: ${{ github.event.before }}
          LUAT_PACKAGE_PUBLISH: 'true'
      - name: Commit generated indexes
        run: |
          git add index
          if git diff --cached --quiet -- index; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: publish package indexes"
          git push
